name: Windows Setup receipt diagnostic
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  replay:
    if: github.repository_id == '1286130219' && github.ref == 'refs/heads/main'
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify failing source, unchanged waiter, and the exact retained Windows artifacts
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $baseline='e96102ef6d19b0c39384fb5dab530444dba3f5b8'
          if ((git rev-parse "$baseline^{tree}") -cne 'b90c0433ea491b5d1f9aa62df82bdc681cfb86c1') { throw 'Baseline tree mismatch' }
          git diff --quiet $baseline $env:GITHUB_SHA -- native/src/NativePreviewSetupWaiter.cpp native/src/NativeGithubPreview.cpp native/src/NativeGithubPreviewFeed.cpp native/src/NativeActivationCore.cpp native/github-preview-update/PreviewUpdate.cmake
          if ($LASTEXITCODE) { throw 'Production handoff source differs from the observed failure' }
          $api="repos/$env:GITHUB_REPOSITORY/actions"
          $oldRun=44729280401
          $run=gh api "$api/runs/$oldRun" | ConvertFrom-Json
          if ($LASTEXITCODE -or $run.head_sha -cne $baseline -or $run.conclusion -cne 'failure' -or
              $run.path -cne '.github/workflows/native-windows.yml') { throw 'Unexpected original run' }
          $hashes=@{
            '14630328673'='sha256:510abe76da34b3ef39b87f3c0849a7f374e16b9a8954dcdc45dbde2da6e38e1d'
            '14630079338'='sha256:b5af0a5b0febc412f645aba152421450e3ec6339828979a13e58161a4bae5885'
          }
          foreach ($id in $hashes.Keys) {
            $a=gh api "$api/artifacts/$id" | ConvertFrom-Json
            if ($LASTEXITCODE -or $a.expired -or $a.workflow_run.id -ne $oldRun -or
                $a.workflow_run.head_sha -cne $baseline -or $a.digest -cne $hashes[$id]) { throw "Artifact mismatch: $id" }
          }
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          cache: true
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: '14630328673'
          run-id: '44729280401'
          github-token: ${{ github.token }}
          digest-mismatch: error
          path: D:/gsw-preview-qa/payload
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: '14630079338'
          run-id: '44729280401'
          github-token: ${{ github.token }}
          digest-mismatch: error
          path: D:/gsw-preview-qa/setup
      - name: Build the test transport and the separately instrumented test waiter
        shell: pwsh
        run: |
          cmake -S native/github-preview-update -B D:/gsw-preview-qa/build -A x64 -DGSW_PREVIEW_ACCEPTANCE=ON
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build D:/gsw-preview-qa/build --config Release --target gsw_github_preview_fixture gsw_setup_receipt_trace --parallel 4
          exit $LASTEXITCODE
      - name: Prepare isolated remote display
        shell: pwsh
        run: |
          ./scripts/setup_native_ci_display.ps1
          ./scripts/setup_native_ci_graphics.ps1
      - name: Reproduce the original Setup handoff without handling any Windows prompts
        shell: pwsh
        run: |
          $setup=@(Get-ChildItem D:/gsw-preview-qa/setup -Recurse -File -Filter '*-setup.exe')
          if ($setup.Count -ne 1) { throw 'Expected exactly one product Setup' }
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $setup[0].FullName).Hash -ine
              'c892d8b638960a246b5003010c3102ed096109f364fa823f3785df32cb0841e2') { throw 'Wrong Setup bytes' }
          python -I -B native/github-preview-update/accept_installations.py --root D:/gsw-preview-qa/installations --package D:/gsw-preview-qa/payload --setup $setup[0].FullName --fixture D:/gsw-preview-qa/build/Release/gsw_github_preview_fixture.exe --release-dir D:/gsw-preview-qa/release --evidence D:/gsw-preview-qa/evidence --isolated-setup-waiter D:/gsw-preview-qa/build/Release/gsw_setup_receipt_trace.exe
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: setup-receipt-diagnostic
          path: D:/gsw-preview-qa/evidence/
          if-no-files-found: warn
          retention-days: 30
