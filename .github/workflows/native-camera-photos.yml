name: Native Camera Photos

# Manual, exact-source pre-push gate. Inputs may not alter the workflow,
# training algorithms, package trust, or release configuration.
on:
  workflow_dispatch:
    inputs:
      suite:
        description: Exact camera cards, training originals, or calibrated camera overlay gate
        type: choice
        default: camera-cards
        options: [camera-cards, task-preview-red, task-preview-green, labels-overlay-red, labels-overlay-green]
      candidate:
        description: Unreferenced product commit directly extending the dispatch source
        type: string
        required: true
      candidate_tree:
        description: Expected product Git tree
        type: string
        required: true
      witness:
        description: Unreferenced baseline plus the single existing visual assertion
        type: string
        required: true
      witness_tree:
        description: Expected witness Git tree
        type: string
        required: true

permissions:
  contents: read

jobs:
  accept:
    name: Windows camera photos (${{ matrix.kind }})
    if: github.repository_id == '1286130219' && github.ref == 'refs/heads/main' && github.actor_id == github.repository_owner_id
    strategy:
      fail-fast: false
      matrix:
        kind: ${{ fromJSON((inputs.suite == 'task-preview-red' || inputs.suite == 'labels-overlay-red') && '["witness"]' || (inputs.suite == 'task-preview-green' || inputs.suite == 'labels-overlay-green') && '["candidate"]' || '["witness","candidate"]') }}
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      CASE: ${{ matrix.kind }}
      SUITE: ${{ inputs.suite }}
      SOURCE_ID: ${{ matrix.kind == 'witness' && inputs.witness || inputs.candidate }}
      SOURCE_TREE: ${{ matrix.kind == 'witness' && inputs.witness_tree || inputs.candidate_tree }}
      QT_FORCE_STDERR_LOGGING: "1"
      QT_LOGGING_TO_CONSOLE: "1"
      QT_STYLE_OVERRIDE: windows11
      CUDA_VISIBLE_DEVICES: "-1"

    steps:
      - name: Restrict the exact detached source and diff before checkout
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or $env:RUNNER_OS -cne 'Windows' -or
              $env:GITHUB_REPOSITORY_ID -cne '1286130219' -or $env:SOURCE_ID -cnotmatch '^[0-9a-f]{40}$' -or
              $env:SOURCE_TREE -cnotmatch '^[0-9a-f]{40}$' -or $env:SOURCE_ID -ceq $env:GITHUB_SHA) {
            throw 'Invalid hosted camera-photo source identity'
          }
          $repo = "repos/$env:GITHUB_REPOSITORY"
          $commit = gh api "$repo/git/commits/$env:SOURCE_ID" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $commit.sha -cne $env:SOURCE_ID -or $commit.tree.sha -cne $env:SOURCE_TREE -or
              @($commit.parents).Count -ne 1 -or $commit.parents[0].sha -cne $env:GITHUB_SHA) {
            throw 'Detached candidate must be an exact child of the workflow dispatch commit'
          }
          $comparison = gh api "$repo/compare/$env:GITHUB_SHA...${env:SOURCE_ID}" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $comparison.total_commits -ne 1 -or $comparison.status -ne 'ahead') {
            throw 'Unexpected candidate compare history'
          }
          $taskPreview = $env:SUITE -cin @('task-preview-red', 'task-preview-green')
          $calibrated = $env:SUITE -cin @('labels-overlay-red', 'labels-overlay-green')
          $allowed = if ($taskPreview) { @('native/src/ProcessingCompletionSmokeTest.cpp') }
                     else { @('native/src/ReconstructionReviewSmokeTest.cpp') }
          $allowed = @($allowed)
          if ($calibrated -and $env:CASE -ceq 'candidate') {
            $allowed += @(
              'CHANGELOG.md', 'CHANGELOG.zh-CN.md', 'CHANGELOG.ja.md',
              'native/i18n/catalog.json', 'native/backend/reconstruction_review.py',
              'native/worker/test_reconstruction_review.py', 'native/src/CameraPhotoIO.cpp',
              'native/src/CameraPhotoIO.h', 'native/src/MainWindow.cpp', 'native/src/MainWindow.h',
              'native/src/MainWindowCameraPhotos.cpp', 'native/src/NativeViewport.cpp',
              'native/src/NativeViewport.h', 'native/src/ProcessingCompletionSmokeTest.cpp'
            )
          } elseif ($taskPreview -and $env:CASE -ceq 'candidate') {
            $allowed += @(
              'CHANGELOG.md', 'CHANGELOG.zh-CN.md', 'CHANGELOG.ja.md',
              'native/README.md', 'native/i18n/catalog.json',
              'native/backend/reconstruction_review.py',
              'native/worker/reconstruction_review.py', 'native/worker/test_reconstruction_review.py',
              'native/src/MainWindow.cpp', 'native/src/MainWindow.h', 'native/src/MainWindowCameraPhotos.cpp',
              'native/src/NativeViewport.cpp', 'native/src/NativeViewport.h'
            )
          } elseif (!$taskPreview -and $env:CASE -ceq 'candidate') {
            $allowed += @(
              'CHANGELOG.md', 'CHANGELOG.zh-CN.md', 'CHANGELOG.ja.md',
              'native/CMakeLists.txt', 'native/README.md', 'native/i18n/catalog.json',
              'native/src/CameraTrajectory.cpp', 'native/src/CameraTrajectory.h',
              'native/src/CameraPhotoIO.cpp', 'native/src/CameraPhotoIO.h',
              'native/src/MainWindow.cpp', 'native/src/MainWindow.h', 'native/src/MainWindowCameraPhotos.cpp',
              'native/src/NativeViewport.cpp', 'native/src/NativeViewport.h',
              'native/src/ReconstructionReviewDialog.cpp'
            )
          }
          $files = @($comparison.files)
          if ($null -ne ($files | Where-Object { $_.status -cnotin @('added','modified') }) -or
              (($files.filename | Sort-Object) -join '|') -cne (($allowed | Sort-Object) -join '|')) {
            throw 'Candidate changed the wrong set of files'
          }
          "GSW_CAMERA_DIFF=$($allowed -join '|')" >> $env:GITHUB_ENV

      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_ID }}
          fetch-depth: 2
          persist-credentials: false

      - name: Record and recheck the checkout and evidence paths
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $head = (git rev-parse HEAD).Trim()
          $tree = (git rev-parse 'HEAD^{tree}').Trim()
          $parent = (git rev-parse 'HEAD^').Trim()
          if ($LASTEXITCODE -ne 0 -or $head -cne $env:SOURCE_ID -or $tree -cne $env:SOURCE_TREE -or
              $parent -cne $env:GITHUB_SHA -or @(git status --porcelain).Count -ne 0) { throw 'Checkout drift' }
          $actual = @(git diff-tree --no-commit-id --name-only -r HEAD)
          if ($LASTEXITCODE -ne 0 -or (($actual | Sort-Object) -join '|') -cne
              (($env:GSW_CAMERA_DIFF.Split('|') | Sort-Object) -join '|')) { throw 'Checked out diff differs' }
          foreach ($path in $actual) {
            if ((git ls-tree HEAD -- $path) -cnotmatch '^100644 blob [0-9a-f]{40}\s') { throw "Nonregular file: $path" }
          }
          $drive = if (Test-Path -LiteralPath 'D:/') { 'D:/' } else { $env:RUNNER_TEMP }
          $qa = Join-Path $drive ("gsw-photo-" + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT + '-' + $env:CASE)
          if (Test-Path -LiteralPath $qa) { throw 'Camera photo test root already exists' }
          New-Item -ItemType Directory -Path "$qa/evidence/screenshots","$qa/temp" | Out-Null
          "GSW_CAMERA_QA=$qa" >> $env:GITHUB_ENV
          "GSW_CAMERA_EVIDENCE=$qa/evidence" >> $env:GITHUB_ENV
          "GSW_RECONSTRUCTION_REVIEW_ROOT=$qa/fixtures" >> $env:GITHUB_ENV
          "GSW_SMOKE_OUTPUT_DIR=$qa/evidence/screenshots" >> $env:GITHUB_ENV
          "GSW_BACKEND_ROOT=$env:GITHUB_WORKSPACE" >> $env:GITHUB_ENV
          "GS_EDITOR_WORKSPACE_ROOT=$qa/workspaces" >> $env:GITHUB_ENV
          "TEMP=$qa/temp" >> $env:GITHUB_ENV
          "TMP=$qa/temp" >> $env:GITHUB_ENV
          [ordered]@{ sourceCommit=$head; sourceTree=$tree; parent=$parent;
            gateCommit=$env:GITHUB_WORKFLOW_SHA; repositoryId=$env:GITHUB_REPOSITORY_ID;
            runId=$env:GITHUB_RUN_ID; runAttempt=$env:GITHUB_RUN_ATTEMPT; case=$env:CASE; suite=$env:SUITE } |
            ConvertTo-Json | Set-Content -LiteralPath "$qa/evidence/source.json" -Encoding utf8

      - name: Set up Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Set up QA Python
        id: python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: scripts/requirements-native-checks.txt

      - name: Install the existing native QA dependencies
        shell: pwsh
        env:
          QA_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          & $env:QA_PYTHON -m pip install -r scripts/requirements-native-checks.txt
          if ($LASTEXITCODE -ne 0) { throw 'QA dependencies failed' }
          & $env:QA_PYTHON -I -B scripts/verify_native_backend.py --root .
          if ($LASTEXITCODE -ne 0) { throw 'Native source boundary failed' }
          $root = Join-Path $env:GSW_CAMERA_QA 'deps'
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install zlib:x64-windows-static-md zstd:x64-windows-static-md `
            "--x-install-root=$root/installed" "--x-buildtrees-root=$root/buildtrees" `
            "--x-packages-root=$root/packages" "--downloads-root=$root/downloads"
          if ($LASTEXITCODE -ne 0) { throw 'Codec dependencies failed' }

      - name: Build only the camera and viewport test targets
        shell: pwsh
        env:
          QA_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          $build = Join-Path $env:GSW_CAMERA_QA 'build'
          $date = (Get-Content -LiteralPath native/build_manifest.json -Raw | ConvertFrom-Json).releaseDate
          cmake -S native -B "$build" -G 'Visual Studio 17 2022' -A x64 `
            -DBUILD_TESTING=ON -DGSW_ENABLE_RENDER_DIAGNOSTICS_CAPTURE_TEST=ON -DGSW_TEST_OPENGL_BACKEND=software `
            "-DGSW_RELEASE_DATE=$date" '-DCMAKE_CXX_FLAGS=/MP2' "-DPython3_EXECUTABLE=$env:QA_PYTHON" `
            "-DCMAKE_INSTALL_PREFIX=$env:GSW_CAMERA_QA/staging" `
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            "-DVCPKG_INSTALLED_DIR=$env:GSW_CAMERA_QA/deps/installed" -DVCPKG_TARGET_TRIPLET=x64-windows-static-md
          if ($LASTEXITCODE -ne 0) { throw 'Camera configuration failed' }
          $targets = @('GaussianSceneWorkbench')
          if ($env:SUITE -cin @('task-preview-red', 'task-preview-green', 'labels-overlay-green')) {
            $targets += 'gsw_process_output_fixture'
          } elseif ($env:CASE -ceq 'candidate') {
            $targets += @('gsw_camera_trajectory_tests','gsw_native_viewport_locale_tests')
          }
          cmake --build "$build" --config Release --parallel --target @targets 2>&1 |
            Tee-Object -FilePath "$env:GSW_CAMERA_EVIDENCE/build.log"
          if ($LASTEXITCODE -ne 0) { throw 'Camera build failed' }
          (Get-FileHash -LiteralPath "$build/Release/Gaussian Scene Workbench.exe" -Algorithm SHA256).Hash |
            Set-Content -LiteralPath "$env:GSW_CAMERA_EVIDENCE/executable.sha256" -Encoding ascii

      - name: Set up the hosted Windows display and graphics
        shell: pwsh
        run: |
          ./scripts/setup_native_ci_display.ps1
          ./scripts/setup_native_ci_graphics.ps1 -OutputDirectory "$env:GSW_CAMERA_QA/mesa"

      - name: Observe baseline RED or require candidate GREEN at the real window
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $build = Join-Path $env:GSW_CAMERA_QA 'build'
          $evidence = $env:GSW_CAMERA_EVIDENCE
          $taskPreview = $env:SUITE -cin @('task-preview-red', 'task-preview-green')
          $names = @('native_reconstruction_review')
          if ($env:SUITE -ceq 'labels-overlay-green') {
            $names += @('native_processing_completion', 'native_reconstruction_review_contracts')
          } elseif ($taskPreview) {
            $names = @('native_processing_completion')
            if ($env:CASE -ceq 'candidate') {
              $names += @('native_reconstruction_review', 'native_reconstruction_review_contracts')
            }
          } elseif ($env:CASE -ceq 'candidate') {
            $names += @('native_camera_trajectory_contract', 'native_viewport_locale_contract')
            foreach ($lang in @('zh_CN','en_US','ja_JP')) {
              foreach ($theme in @('light','dark')) { $names += "native_scene_visibility_${lang}_${theme}" }
            }
          }
          $pattern = '^(' + ($names -join '|') + ')$'
          ctest --test-dir "$build" -C Release --no-tests=error --verbose --output-on-failure `
            --output-log "$evidence/ctest.log" --output-junit "$evidence/ctest.xml" -R $pattern
          $exit = $LASTEXITCODE
          [xml]$report = Get-Content -Raw -LiteralPath "$evidence/ctest.xml"
          $cases = @($report.SelectNodes('//testcase'))
          if ((($cases.name | Sort-Object) -join '|') -cne (($names | Sort-Object) -join '|')) {
            throw 'Missing or unexpected camera test cases'
          }
          $log = Get-Content -Raw -LiteralPath "$evidence/ctest.log"
          if ($env:SUITE -ceq 'labels-overlay-red') {
            if ($exit -eq 0 -or $null -eq $cases[0].SelectSingleNode('failure') -or
                !$log.Contains('Reconstruction review PASS: main dock displays the verified second original and not the same-name neighbor') -or
                !$log.Contains('Reconstruction review FAIL: camera name leaders have an independent viewport control') -or
                $log -cmatch 'Reconstruction review FAIL: (?!camera name leaders have an independent viewport control)') {
              throw 'The expected missing label control was not isolated at the real window'
            }
            'REPRODUCED_RED (baseline camera photos have no label control)' |
              Set-Content -LiteralPath "$evidence/outcome.txt" -Encoding utf8
          } elseif ($env:SUITE -ceq 'task-preview-red') {
            if ($exit -eq 0 -or $null -eq $cases[0].SelectSingleNode('failure') -or
                $log -cnotmatch 'Processing completion FAIL: live preview opens its verified task original before optimizer completion' -or
                $log -cmatch 'Processing completion FAIL: (?!live preview opens its verified task original before optimizer completion)') {
              throw 'Expected original-photo loss on an actual live observation was not isolated'
            }
            'REPRODUCED_RED (real Windows live preview lacks its owned original)' |
              Set-Content -LiteralPath "$evidence/outcome.txt" -Encoding utf8
          } elseif ($env:CASE -ceq 'witness') {
            if ($exit -eq 0 -or $null -eq $cases[0].SelectSingleNode('failure') -or
                $log -cnotmatch 'Reconstruction review PASS: real viewport captures the same orthographic comparison' -or
                $log -cnotmatch 'Reconstruction review FAIL: default camera overlay shows blue cards without green diagnostic rays' -or
                $log -cnotmatch 'camera overlay pixels: blue=\d+ green=[1-9]\d*') {
              throw 'Expected unmodified-product RED was not observed'
            }
            'REPRODUCED_RED (expected negative control, not candidate acceptance)' |
              Set-Content -LiteralPath "$evidence/outcome.txt" -Encoding utf8
          } else {
            if ($exit -ne 0 -or $report.SelectNodes('//testcase/failure | //testcase/skipped').Count -ne 0) {
              throw 'Camera/viewport candidate failed or skipped an expected case'
            }
            if ($env:SUITE -ceq 'task-preview-green') {
              foreach ($backend in @('3dgs', '2dgs')) {
                foreach ($terminal in @('paused', 'cancelled')) {
                  if (!$log.Contains("Processing completion PASS: $backend live + $terminal original photo pixels")) {
                    throw "Missing real preview gallery result for $backend / $terminal"
                  }
                }
              }
            }
            'PASS (scoped real Windows viewport, not full release acceptance)' |
              Set-Content -LiteralPath "$evidence/outcome.txt" -Encoding utf8
          }
          # The raw CTest failure is intentional only after the witness checks
          # above proved the expected old behavior and retained its RED receipt.
          # Do not let the PowerShell runner propagate that child exit code.
          exit 0

      - uses: actions/upload-artifact@v7
        if: always() && env.GSW_CAMERA_EVIDENCE != ''
        with:
          name: native-camera-photos-${{ matrix.kind }}
          path: |
            ${{ env.GSW_CAMERA_EVIDENCE }}
            ${{ env.GSW_CAMERA_QA }}/build/reconstruction-review-evidence
          if-no-files-found: error
          retention-days: 14
